{% extends "base.html" %}
{% block title %}Resend Invitation — RetireSim{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-xl shadow overflow-hidden p-6 mt-8">
  <h2 class="text-xl font-bold text-gray-900 mb-4">Resend Invitation?</h2>
  <p class="text-gray-600 mb-6">
    Are you sure you want to resend the invitation to <strong>{{ invitation.email }}</strong>?
    This will send a new email and reset the expiration date.
  </p>
  
  <form method="post" class="flex items-center gap-4">
    {% csrf_token %}
    <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700">Yes, Resend</button>
    <a href="{% url 'accounts:invite_list' %}" class="text-gray-500 hover:text-gray-700 font-medium">Cancel</a>
  </form>
</div>
{% endblock %}
