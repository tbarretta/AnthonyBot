version: '3.8'

services:
  web:
    build: .
    command: gunicorn nodoubleu.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=nodoubleu.settings.development
      - DEBUG=True
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=nodoubleu
      - POSTGRES_USER=ndu_user
      - POSTGRES_PASSWORD=ndu_password

volumes:
  postgres_data:
